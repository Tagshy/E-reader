name: Gerar APK Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar e verificar APK
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Leitura.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Leitura-APK
          path: Leitura.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publicar APK para download direto
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Leitura.apk --target "$GITHUB_SHA" --title "Leitura APK ${GITHUB_RUN_NUMBER}" --notes "APK de debug para uso pessoal. Requer Android 8.0 ou superior."
    permissions:
      contents: write