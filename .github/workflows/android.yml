name: Leitura Android
on:
  push:
    branches: [main, leitura-2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar, testar e verificar
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar PDFs offline e interface no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Preparar APK validado
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Leitura-2.0.apk
          sha256sum Leitura-2.0.apk > Leitura-2.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Leitura-2.0-APK
          path: |
            Leitura-2.0.apk
            Leitura-2.0.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Leitura-verificacoes
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
      - name: Publicar nova release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Leitura-2.0.apk Leitura-2.0.apk.sha256 --target "$GITHUB_SHA" --title "Leitura 2.0" --notes-file RELEASE_NOTES.md
    permissions:
      contents: write
